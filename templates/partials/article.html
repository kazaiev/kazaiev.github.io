<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">{% if page.date %}<time datetime="{{ page.date }}">{{ page.date | date(format="%-d %B %Y") }}</time> · {% endif %}{{ page.reading_time }} min{% if page.extra.project %} · <a href="{{ get_url(path='@/projects/' ~ page.extra.project ~ '/_index.md') }}">{{ page.extra.project }}</a>{% endif %}</p>
  {{ page.content | safe }}
</article>
